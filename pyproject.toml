[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tomlmini"
version = "0.1.0"
description = "Zero-dependency parser for the TOML v1.0 common subset (values, tables, arrays of tables, inline tables, datetimes)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "nripankadas07" }]
keywords = ["toml", "config", "parser", "settings", "configuration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/nripankadas07/tomlmini"
Repository = "https://github.com/nripankadas07/tomlmini"

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "tomli>=2; python_version < '3.11'",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tomlmini = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "N", "PERF", "PYI", "RET", "RUF", "SIM", "UP", "W"]

[tool.mypy]
python_version = "3.10"
files = ["src/tomlmini"]
strict = true
warn_unreachable = true

[tool.coverage.run]
branch = true
source = ["tomlmini"]

[tool.coverage.report]
show_missing = true
skip_covered = true
